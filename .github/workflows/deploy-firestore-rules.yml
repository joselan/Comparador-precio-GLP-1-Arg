name: Deploy Firestore Rules

# Publica firestore.rules en el proyecto de Firebase cada vez que cambian.
# Usa el mismo service account que el scraper (secret FIREBASE_SERVICE_ACCOUNT)
# y la API REST de Firebase Rules (ver scripts/deploy-rules.js).

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Deploy Firestore rules
        run: node deploy-rules.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

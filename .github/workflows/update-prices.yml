name: Update GLP-1 Prices

on:
  schedule:
    # Las alertas de precios SOLO salen entre las 8 y las 21 ART. Para lograrlo, el
    # scraper corre únicamente dentro de esa franja: así cualquier email que mande
    # cae en horario. El primer run del día (8 AM) toma los cambios ocurridos fuera
    # de horario (de noche) y recién ahí los avisa. ART = UTC-3.
    - cron: '0 11 * * 1-5'  #  8:00 AM ART (UTC-3) Mon–Fri — primer aviso del día
    - cron: '0 15 * * 1-5'  # 12:00 PM ART
    - cron: '0 19 * * 1-5'  #  4:00 PM ART
    - cron: '0 23 * * 1-5'  #  8:00 PM ART
  push:
    branches: [main]
    # Sólo re-corre el scraper cuando cambia el scraper (o sus deps), no cualquier
    # cosa dentro de scripts/ (ej. el build del front build-web.js, los tests o
    # deploy-rules.js): así tocar el front no dispara un scrape ni escribe en Firebase.
    paths:
      - 'scripts/update-prices.js'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/update-prices.yml'
  workflow_dispatch: # Allow manual trigger for testing
    inputs:
      dry_run:
        description: 'Simulación: scrapea y muestra qué haría, sin escribir en Firebase ni enviar emails'
        type: boolean
        default: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run price updater
        run: node update-prices.js ${{ inputs.dry_run == true && '--dry-run' || '' }}
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Credencial del proyecto calc-precio-mounjaro-arg para sincronizar los
          # PVP de Mounjaro en esa app. Si el secret no existe, el sync se omite.
          FIREBASE_SERVICE_ACCOUNT_MOUNJARO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOUNJARO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Google Chrome is pre-installed on ubuntu-latest runners
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      # Si el scrape falló, subir lo que alfabeta le devolvió al runner (HTML +
      # captura) para diagnosticar si es un bloqueo/captcha o un cambio de layout.
      - name: Upload alfabeta diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alfabeta-diagnostics
          path: |
            scripts/diag-alfabeta.html
            scripts/diag-alfabeta.png
          if-no-files-found: ignore
          retention-days: 7

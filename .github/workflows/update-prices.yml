name: Update GLP-1 Prices

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 12:00 AM ART (UTC-3) Mon–Fri
    - cron: '0 9 * * 1-5'   #  6:00 AM ART
    - cron: '0 15 * * 1-5'  # 12:00 PM ART
    - cron: '0 21 * * 1-5'  #  6:00 PM ART
  workflow_dispatch: # Allow manual trigger for testing
    inputs:
      dry_run:
        description: 'Simulación: scrapea y muestra qué haría, sin escribir en Firebase ni enviar emails'
        type: boolean
        default: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run price updater
        run: node update-prices.js ${{ inputs.dry_run == true && '--dry-run' || '' }}
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Google Chrome is pre-installed on ubuntu-latest runners
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

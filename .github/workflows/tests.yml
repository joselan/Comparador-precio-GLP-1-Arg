name: Tests

# Corre los tests unitarios del scraper en cada PR y en cada push a main.
# Los tests son de funciones puras (parsing/matching de dosis y merge de la BD),
# así que no necesitan dependencias ni red: corren con Node en segundos.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        working-directory: scripts
        run: |
          node test-parse.js
          node test-mergedb.js
          node test-normalize.js
          node test-snapshot.js

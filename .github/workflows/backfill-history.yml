name: Backfill Price History (Wayback)

# Reconstruye historial de precios desde snapshots archivados de alfabeta.net en
# la Wayback Machine.
#
# Se puede disparar de dos formas:
#  - workflow_dispatch (botón "Run workflow"): respeta los inputs de abajo.
#  - push a main que toque este workflow o el script: usa PUSH_MODE (abajo) para
#    decidir si sondea (dry) o carga de verdad (write). Sirve para dispararlo
#    desde herramientas que no tienen permiso de Actions:write.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sondeo: busca en Wayback y muestra qué encontraría, sin escribir en Firebase'
        type: boolean
        default: true
      weeks:
        description: 'Cuántas semanas hacia atrás intentar'
        type: string
        default: '52'
      overwrite:
        description: 'Pisar fechas ya cargadas en el historial (normalmente NO)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-history.js'
      - '.github/workflows/backfill-history.yml'

# Modo para las corridas por PUSH (que no tienen inputs): "dry" = sondeo sin
# escribir; "write" = carga real. Se cambia esta línea y se pushea.
env:
  PUSH_MODE: dry

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run backfill
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
          EVENT: ${{ github.event_name }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_WEEKS: ${{ inputs.weeks }}
          IN_OW: ${{ inputs.overwrite }}
        run: |
          set -e
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$IN_DRY" = "true" ] && DRY="--dry-run" || DRY=""
            export WEEKS="${IN_WEEKS:-52}"
            [ "$IN_OW" = "true" ] && export BACKFILL_OVERWRITE=1 || true
          else
            [ "$PUSH_MODE" = "write" ] && DRY="" || DRY="--dry-run"
            export WEEKS="52"
          fi
          echo "event=$EVENT · modo=${DRY:-WRITE} · weeks=$WEEKS · overwrite=${BACKFILL_OVERWRITE:-0}"
          node backfill-history.js $DRY

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // ==========================================
        // CONFIGURACIÓN DE FIREBASE (Tus datos reales)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAY7dHhkuR8hu582U6O4fi1q5hNUNNedp8",

            projectId: "comparador-precios-glp-1-arg",

        // Inicializar Firebase solo una vez
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const firestore = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = "joselanglois@gmail.com";
        // ==========================================

        const Icons = {
            Logo: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/><circle cx="6" cy="6" r="4.5" fill="currentColor" fillOpacity="0.15"/><path d="M6 3v6M4.5 5h3M4.5 7h3"/></svg>,
            Help: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Sun: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
            Moon: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
            Pill: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4 4 14a5.5 5.5 0 0 0 7.78 7.78l10-10a5.5 5.5 0 0 0-7.78-7.78z"></path><line x1="14" y1="4" x2="20" y2="10"></line></svg>,
            Split: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>,
            Close: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Upload: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Save: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            Lock: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            ImagePlaceholder: () => <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className="text-slate-300 dark:text-slate-600 mb-3"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
            Share: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>,
            Copy: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
            Check: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Chevron: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>,
            Pen: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>,
            Droplet: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.7l5.66 5.66a8 8 0 1 1-11.32 0z"/></svg>,
            Capsule: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="8" width="20" height="8" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/></svg>
        };

        const defaultDb = {
            Mounjaro: { lab: 'Adium', psp: 'Con Voz', hasPsp: true, pspType: 'fixed', pspValue: 0.30, canSplit: true, color: 'bg-blue-600', doses: [ { name: '2.5mg (KwikPen x1)', pvp: 612576.68 }, { name: '5mg (KwikPen x1)', pvp: 829980.63 }, { name: '7.5mg (KwikPen x1)', pvp: null }, { name: '10mg (KwikPen x1)', pvp: null } ] },
            Ozempic: { lab: 'Novo Nordisk', psp: 'Novo a la Par', hasPsp: true, pspType: 'progressive', canSplit: true, color: 'bg-teal-600', doses: [ { name: '0.25mg / 0.5mg (1.5ml + 6 ag)', pvp: 322213.46 }, { name: '1mg (3ml + 4 ag)', pvp: 386656.15 } ] },
            Wegovy: { lab: 'Novo Nordisk', psp: 'Novo a la Par', hasPsp: true, pspType: 'progressive', canSplit: true, color: 'bg-teal-500', doses: [ { name: '0.25mg (1.5ml + 4 ag)', pvp: 322213.46 }, { name: '0.5mg (1.5ml + 4 ag)', pvp: 322213.46 }, { name: '1mg (3ml + 4 ag)', pvp: 386656.15 }, { name: '1.7mg (3ml + 4 ag)', pvp: 541318.63 }, { name: '2.4mg (3ml + 4 ag)', pvp: 757846.07 } ] },
            Dutide: { lab: 'Elea', psp: '-', hasPsp: false, canSplit: false, color: 'bg-purple-600', doses: [ { name: '0.25mg (x4)', pvp: 114334.23 }, { name: '0.5mg (x4)', pvp: 131478.58 }, { name: '1mg (x4)', pvp: 148738.76 } ] },
            Obetide: { lab: 'Elea', psp: '-', hasPsp: false, canSplit: false, color: 'bg-purple-500', doses: [ { name: '0.25mg (x4)', pvp: 114334.23 }, { name: '0.5mg (x4)', pvp: 131478.58 }, { name: '1mg (x4)', pvp: 148738.76 }, { name: '1.7mg (x4)', pvp: 196450.34 }, { name: '2.4mg (x4)', pvp: 256527.14 } ] }
        };

        const formatCurrency = (val) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(val);
        // Versión compacta (sin centavos) para la tabla comparativa en pantallas chicas
        const formatCompact = (val) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);
        // Nombre de dosis abreviado: "5mg (KwikPen x1)" → "5mg"
        const shortDose = (name) => name.split(' (')[0];

        // Estilos derivados del color del producto (chip sólido + fondo tenue para encabezados)
        const colorStyles = {
            'bg-blue-600':   { chip: 'bg-blue-600',   tint: 'bg-blue-50 dark:bg-blue-900/20' },
            'bg-teal-600':   { chip: 'bg-teal-600',   tint: 'bg-teal-50 dark:bg-teal-900/20' },
            'bg-teal-500':   { chip: 'bg-teal-500',   tint: 'bg-teal-50 dark:bg-teal-900/20' },
            'bg-purple-600': { chip: 'bg-purple-600', tint: 'bg-purple-50 dark:bg-purple-900/20' },
            'bg-purple-500': { chip: 'bg-purple-500', tint: 'bg-purple-50 dark:bg-purple-900/20' },
        };
        const styleFor = (c) => colorStyles[c] || { chip: c || 'bg-slate-400', tint: 'bg-slate-50 dark:bg-slate-800' };

        // Ícono por producto y por laboratorio
        const productGlyph = { Mounjaro: Icons.Pen, Ozempic: Icons.Droplet, Wegovy: Icons.Droplet, Dutide: Icons.Capsule, Obetide: Icons.Capsule };
        const labGlyph = { 'Adium': Icons.Pen, 'Novo Nordisk': Icons.Droplet, 'Elea': Icons.Capsule };
        const glyphFor = (name) => productGlyph[name] || Icons.Pill;
        const labGlyphFor = (lab) => labGlyph[lab] || Icons.Pill;

        // Combina la BD local (estructura de referencia: productos y dosis nuevos
        // definidos en el código) con la de Firebase (precios vigentes). Los precios
        // de Firebase mandan; las dosis que aún no existen en Firebase se agregan
        // desde defaultDb para que aparezcan sin esperar una publicación manual.
        const mergeDb = (base, remote) => {
            if (!remote) return base;
            const merged = {};
            Object.keys(base).forEach(k => {
                if (!remote[k]) { merged[k] = base[k]; return; }
                const remoteDoses = remote[k].doses || [];
                const doses = base[k].doses.map(d => remoteDoses.find(rd => rd.name === d.name) || d);
                remoteDoses.forEach(rd => { if (!doses.some(d => d.name === rd.name)) doses.push(rd); });
                merged[k] = { ...base[k], ...remote[k], doses };
            });
            Object.keys(remote).forEach(k => { if (!merged[k]) merged[k] = remote[k]; });
            return merged;
        };

        function App() {
            // Estado Principal de la BD
            const [db, setDb] = useState(defaultDb);
            const [loadingDb, setLoadingDb] = useState(true);
            const [lastUpdated, setLastUpdated] = useState(null);

            // Estados de la Calculadora
            const [med, setMed] = useState('Mounjaro');
            const [doseIdx, setDoseIdx] = useState(0);
            const [ooss, setOoss] = useState(0);
            const [month, setMonth] = useState(1);
            const [usePsp, setUsePsp] = useState(true);
            const [isMonthly, setIsMonthly] = useState(false);
            const [dark, setDark] = useState(false);
            const [tut, setTut] = useState(false);
            const [copied, setCopied] = useState(false);
            const [detailOpen, setDetailOpen] = useState(false);
            const [grouped, setGrouped] = useState(false);

            // Estados para Autenticación de Administrador
            const [clicks, setClicks] = useState(0);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);

            // 1. Cargar datos en Tiempo Real desde Firebase
            useEffect(() => {
                const unsubscribe = firestore.collection('config').doc('prices')
                    .onSnapshot((doc) => {
                        if (doc.exists && doc.data().db) {
                            setDb(mergeDb(defaultDb, doc.data().db));
                            const lu = doc.data().lastUpdated;
                            setLastUpdated(lu && lu.toDate ? lu.toDate() : null);
                        } else {
                            // Si no existe, usamos los de defecto
                            setDb(defaultDb);
                        }
                        setLoadingDb(false);
                    }, (error) => {
                        console.error("Error obteniendo datos de Firebase:", error);
                        // Si falla Firebase (ej. config vacía), usa locales para que la app no se rompa
                        setDb(defaultDb); 
                        setLoadingDb(false);
                    });

                return () => unsubscribe();
            }, []);

            // 2a. Mostrar tutorial en las primeras visitas (solo al montar)
            useEffect(() => {
                const v = parseInt(localStorage.getItem('glp1_visits') || '0');
                if (v < 5) setTut(true);
            }, []);

            // 2b. Actualizar clase dark en el DOM al cambiar el modo
            useEffect(() => {
                if (dark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [dark]);

            // 3. Detector de los 5 clics
            useEffect(() => {
                if (clicks > 0 && clicks < 5) {
                    const timer = setTimeout(() => setClicks(0), 1500); 
                    return () => clearTimeout(timer);
                }
                if (clicks >= 5) {
                    setShowAuthModal(true);
                    setAuthError('');
                    setClicks(0);
                }
            }, [clicks]);

            // Cierra el panel admin y termina la sesión de administrador.
            // El usuario queda autenticado SOLO mientras el panel está abierto,
            // que es lo que las reglas de Firestore exigen para poder guardar.
            const closeAdmin = () => {
                setShowAdmin(false);
                auth.signOut().catch(() => {});
            };

            const handleGoogleLogin = async () => {
                setAuthLoading(true);
                setAuthError('');
                try {
                    // Sesión en memoria únicamente: no sobrevive a un refresh de la página.
                    await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ login_hint: ADMIN_EMAIL });
                    const result = await auth.signInWithPopup(provider);
                    if (result.user.email === ADMIN_EMAIL) {
                        // Se mantiene la sesión abierta; se cierra al salir del panel (closeAdmin).
                        setShowAuthModal(false);
                        setShowAdmin(true);
                    } else {
                        setAuthError('Cuenta no autorizada: ' + result.user.email);
                        auth.signOut();
                    }
                } catch (error) {
                    console.error("Error en autenticación:", error);
                    if (error.code === 'auth/popup-blocked') {
                        setAuthError('El navegador bloqueó la ventana emergente. Permitila en la barra de direcciones e intentá de nuevo.');
                    } else if (error.code === 'auth/unauthorized-domain') {
                        setAuthError('Dominio no autorizado. Agregá este sitio en Firebase Console → Authentication → Authorized domains.');
                    } else if (error.code === 'auth/popup-closed-by-user') {
                        setAuthError('');
                    } else {
                        setAuthError('Error: ' + (error.message || error.code));
                    }
                }
                setAuthLoading(false);
            };

            const closeTut = () => {
                const v = parseInt(localStorage.getItem('glp1_visits') || '0');
                localStorage.setItem('glp1_visits', (v + 1).toString());
                setTut(false);
            };

            const calc = (pvp, item, curMonth, oossPerc, activePsp, monthly) => {
                let pspPerc = 0;
                if (activePsp && item.hasPsp) {
                    if (item.pspType === 'fixed') pspPerc = item.pspValue;
                    else {
                        if (curMonth <= 2) pspPerc = 0.25;
                        else if (curMonth <= 4) pspPerc = 0.30;
                        else pspPerc = 0.35;
                    }
                }

                // PSP se aplica sobre el PVP completo
                const pspAmt = pvp * pspPerc;
                const saldoPostPsp = pvp - pspAmt;

                // OOSS/Farmacia se aplica sobre el saldo después del PSP
                const oossAmt = saldoPostPsp * (oossPerc / 100);
                const final = saldoPostPsp - oossAmt;
                const perMonth = (monthly && item.canSplit) ? final / 2 : final;

                return { pvp, oossAmt, pspAmt, final, perMonth, pspPerc };
            };

            const current = db[med] || defaultDb['Mounjaro'];
            const activeDose = current.doses[doseIdx] || current.doses[0];
            const res = calc(activeDose.pvp, current, month, ooss, usePsp, isMonthly);

            // Ahorro respecto del PVP (lo que descuentan PSP + OOSS sobre la caja)
            const savings = res.pvp ? res.pvp - res.final : 0;
            const savingsPct = res.pvp ? (savings / res.pvp) * 100 : 0;

            // Resumen de texto para compartir/copiar el cálculo actual
            const buildShareText = () => {
                const lines = [];
                lines.push('💊 Comparador de precios GLP-1/GIP Argentina');
                lines.push(`${med} ${activeDose.name} — ${current.lab}`);
                lines.push(`PVP: ${formatCurrency(res.pvp)}`);
                if (usePsp && current.hasPsp) lines.push(`Descuento PSP (${current.psp} ${(res.pspPerc * 100).toFixed(0)}%): -${formatCurrency(res.pspAmt)}`);
                if (ooss > 0) lines.push(`OOSS/Prepaga/Farmacia (${ooss}%): -${formatCurrency(res.oossAmt)}`);
                lines.push(`Precio final de la caja: ${formatCurrency(res.final)}`);
                if (isMonthly && current.canSplit) lines.push(`Costo por mes (rinde 2 meses): ${formatCurrency(res.perMonth)}`);
                if (savings > 0) lines.push(`Ahorro vs PVP: ${formatCurrency(savings)} (${savingsPct.toFixed(0)}%)`);
                lines.push('');
                lines.push(`Calculá el tuyo: ${window.location.href}`);
                return lines.join('\n');
            };

            const shareResult = async () => {
                const text = buildShareText();
                if (navigator.share) {
                    try { await navigator.share({ title: 'Comparador GLP-1/GIP Argentina', text }); return; }
                    catch (e) { if (e.name === 'AbortError') return; }
                }
                window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
            };

            const copyResult = async () => {
                const text = buildShareText();
                const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
                try {
                    await navigator.clipboard.writeText(text);
                    done();
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); done(); } catch (_) {}
                    document.body.removeChild(ta);
                }
            };

            // Abre la ficha de detalle para un producto+dosis (desde la tabla)
            const openDetail = (label, dIdx) => {
                setMed(label);
                setDoseIdx(dIdx);
                setDetailOpen(true);
            };

            const comparison = useMemo(() => {
                let list = [];
                let pending = [];
                Object.keys(db).forEach(k => {
                    db[k].doses.forEach((d, di) => {
                        // Dosis sin PVP publicado aún: no entran al ranking
                        if (!d.pvp) { pending.push({ label: k, dose: d.name, dIdx: di, color: db[k].color, lab: db[k].lab }); return; }
                        const r = calc(d.pvp, db[k], month, ooss, usePsp, isMonthly);
                        list.push({ label: k, dose: d.name, dIdx: di, ...r, color: db[k].color, canSplit: db[k].canSplit, lab: db[k].lab });
                    });
                });
                list.sort((a, b) => a.perMonth - b.perMonth);

                // Agrupado por laboratorio (grupos ordenados por su dosis más barata)
                const labGroups = {};
                const order = [];
                Object.keys(db).forEach(k => {
                    const lab = db[k].lab;
                    if (!labGroups[lab]) { labGroups[lab] = { lab, color: db[k].color, rows: [], pending: [] }; order.push(lab); }
                });
                list.forEach(it => labGroups[it.lab] && labGroups[it.lab].rows.push(it));
                pending.forEach(p => labGroups[p.lab] && labGroups[p.lab].pending.push(p));
                const byLab = order.map(l => labGroups[l])
                    .filter(g => g.rows.length || g.pending.length)
                    .map(g => ({ ...g, min: g.rows.length ? Math.min(...g.rows.map(r => r.perMonth)) : Infinity }))
                    .sort((a, b) => a.min - b.min);

                return { list, pending, byLab };
            }, [db, med, doseIdx, ooss, month, usePsp, isMonthly]);

            // Precio máximo del ranking, para escalar las barras visuales de la tabla
            const maxComparePrice = comparison.list.reduce((m, it) => Math.max(m, it.perMonth), 0) || 1;
            const cheapestKey = comparison.list[0] ? comparison.list[0].label + '|' + comparison.list[0].dose : null;

            // Fila de la tabla (compartida entre la vista por precio y por laboratorio)
            const renderRow = (item, hideLab) => {
                const isCheapest = cheapestKey === item.label + '|' + item.dose;
                const st = styleFor(item.color);
                const Glyph = glyphFor(item.label);
                const selected = detailOpen && item.label === med && item.dose === activeDose.name;
                return (
                    <button key={item.label + item.dose} onClick={() => openDetail(item.label, item.dIdx)} className={`w-full text-left flex items-center gap-3 px-4 py-2.5 border-t border-slate-100 dark:border-slate-700/50 active:bg-slate-100 dark:active:bg-slate-700/40 transition ${selected ? 'bg-blue-50/80 dark:bg-blue-900/25' : isCheapest ? 'bg-emerald-50/40 dark:bg-emerald-900/10' : ''}`}>
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-white flex-shrink-0 shadow-sm ${st.chip}`}><Glyph /></span>
                        <div className="min-w-0 flex-1">
                            <div className="flex items-baseline justify-between gap-2">
                                <div className="flex items-center gap-1.5 min-w-0">
                                    <span className="font-bold text-sm text-slate-900 dark:text-white truncate">{item.label}</span>
                                    {isCheapest && <span className="flex-shrink-0 text-[9px] font-black text-emerald-700 bg-emerald-100 dark:bg-emerald-900/50 dark:text-emerald-300 px-1.5 py-0.5 rounded-full uppercase tracking-wide">Más barato</span>}
                                </div>
                                <span className={`font-black text-sm tabular-nums flex-shrink-0 ${isCheapest ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}`}>{formatCompact(item.perMonth)}</span>
                            </div>
                            <div className="flex items-center justify-between gap-2 mt-0.5">
                                <span className="text-[11px] text-slate-400 truncate">{shortDose(item.dose)}{hideLab ? '' : ' · ' + item.lab}</span>
                                {isMonthly && item.canSplit && <span className="text-[10px] text-slate-400 tabular-nums flex-shrink-0">caja {formatCompact(item.final)}</span>}
                            </div>
                            <div className="mt-1.5 h-1.5 rounded-full bg-slate-100 dark:bg-slate-700/60 overflow-hidden">
                                <div className={`h-full rounded-full ${item.color}`} style={{ width: Math.max(6, (item.perMonth / maxComparePrice) * 100) + '%' }}></div>
                            </div>
                        </div>
                    </button>
                );
            };

            const renderPendingRow = (p, key) => {
                const Glyph = glyphFor(p.label);
                return (
                    <div key={key} className="w-full flex items-center gap-3 px-4 py-2.5 border-t border-slate-100 dark:border-slate-700/50 opacity-60">
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-white flex-shrink-0 ${styleFor(p.color).chip}`}><Glyph /></span>
                        <div className="min-w-0 flex-1">
                            <span className="font-bold text-sm text-slate-700 dark:text-slate-300">{p.label}</span>
                            <div className="text-[11px] text-slate-400 truncate">{shortDose(p.dose)} · {p.lab}</div>
                        </div>
                        <span className="text-[10px] font-semibold text-slate-400 flex-shrink-0">Sin precio aún</span>
                    </div>
                );
            };

            // --- PANEL ADMINISTRADOR ---
            const AdminPanel = () => {
                const [tempDb, setTempDb] = useState(JSON.parse(JSON.stringify(db)));
                const [isSaving, setIsSaving] = useState(false);
                const [manualMode, setManualMode] = useState(false);
                const [manualModeLoading, setManualModeLoading] = useState(true);
                const [priceHistory, setPriceHistory] = useState([]);
                const [historyLoading, setHistoryLoading] = useState(true);
                const [selectedHistMed, setSelectedHistMed] = useState('Mounjaro');
                const chartRef = useRef(null);
                const chartInstance = useRef(null);

                useEffect(() => {
                    firestore.collection('config').doc('prices').get().then(doc => {
                        if (doc.exists) setManualMode(doc.data().manualMode || false);
                        setManualModeLoading(false);
                    });
                    firestore.collection('priceHistory')
                        .orderBy('timestamp', 'desc')
                        .limit(60)
                        .get()
                        .then(snapshot => {
                            const hist = [];
                            snapshot.forEach(d => hist.push({ id: d.id, ...d.data() }));
                            setPriceHistory(hist.reverse());
                            setHistoryLoading(false);
                        }).catch(() => setHistoryLoading(false));
                }, []);

                useEffect(() => {
                    if (historyLoading || !chartRef.current || priceHistory.length === 0) return;
                    const medData = db[selectedHistMed];
                    if (!medData) return;
                    const labels = priceHistory.map(h => h.id);
                    const palette = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'];
                    const datasets = medData.doses.map((dose, i) => ({
                        label: dose.name,
                        data: priceHistory.map(h => h[selectedHistMed]?.[dose.name] || null),
                        borderColor: palette[i % palette.length],
                        backgroundColor: palette[i % palette.length] + '22',
                        tension: 0.4, fill: false, spanGaps: true,
                    }));
                    if (chartInstance.current) chartInstance.current.destroy();
                    chartInstance.current = new Chart(chartRef.current, {
                        type: 'line',
                        data: { labels, datasets },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { position: 'top' } },
                            scales: { y: { ticks: { callback: v => '$' + new Intl.NumberFormat('es-AR').format(v) } } }
                        }
                    });
                    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
                }, [priceHistory, selectedHistMed, historyLoading]);

                const updatePrice = (medKey, dIdx, newPrice) => {
                    const updated = { ...tempDb };
                    updated[medKey].doses[dIdx].pvp = parseFloat(newPrice) || 0;
                    setTempDb(updated);
                };

                const toggleManualMode = async () => {
                    const next = !manualMode;
                    setManualMode(next);
                    await firestore.collection('config').doc('prices').update({ manualMode: next });
                };

                const saveToGlobal = async () => {
                    setIsSaving(true);
                    try {
                        await firestore.collection('config').doc('prices').set({
                            db: tempDb,
                            manualMode: manualMode,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        closeAdmin();
                        alert("¡Precios actualizados exitosamente!");
                    } catch (error) {
                        alert("Error al guardar: " + error.message);
                    }
                    setIsSaving(false);
                };

                const restoreDefaults = () => {
                    if(confirm("¿Restaurar los precios a los de defecto?")) {
                        setTempDb(JSON.parse(JSON.stringify(defaultDb)));
                    }
                };

                const lastUpdates = {};
                if (priceHistory.length > 0) {
                    Object.keys(db).forEach(medName => {
                        for (let i = priceHistory.length - 1; i >= 0; i--) {
                            if (priceHistory[i][medName]) {
                                lastUpdates[medName] = { date: priceHistory[i].id, prices: priceHistory[i][medName] };
                                break;
                            }
                        }
                    });
                }

                return (
                    <div className="fixed inset-0 z-[200] bg-slate-50 dark:bg-slate-950 overflow-y-auto flex flex-col font-sans">
                        {/* Header */}
                        <header className="bg-white dark:bg-slate-900 border-b dark:border-slate-800 p-4 sticky top-0 z-50 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-100 dark:bg-blue-900/50 rounded-xl flex items-center justify-center text-blue-600 dark:text-blue-400">
                                    <Icons.Lock />
                                </div>
                                <div>
                                    <h2 className="text-lg font-bold text-slate-900 dark:text-white leading-tight">Panel de Administración</h2>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">Actualiza los valores de PVP globalmente</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-3 w-full sm:w-auto justify-end">
                                <button
                                    onClick={toggleManualMode}
                                    disabled={manualModeLoading}
                                    className={`px-4 py-2 rounded-xl font-semibold text-sm flex items-center gap-2 transition border ${manualMode ? 'bg-orange-50 text-orange-700 border-orange-300 dark:bg-orange-900/30 dark:text-orange-400 dark:border-orange-700' : 'bg-slate-50 text-slate-600 border-slate-300 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700'}`}
                                >
                                    <span className={`w-2 h-2 rounded-full ${manualMode ? 'bg-orange-500' : 'bg-green-500'}`}></span>
                                    {manualMode ? 'Modo Manual (auto pausado)' : 'Modo Automático'}
                                </button>
                                <button onClick={closeAdmin} disabled={isSaving} className="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold transition disabled:opacity-50">
                                    Cerrar
                                </button>
                                <button onClick={saveToGlobal} disabled={isSaving} className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold flex items-center justify-center gap-2 transition shadow-lg shadow-blue-500/30 disabled:opacity-50">
                                    {isSaving ? "Guardando..." : <><Icons.Save /> Publicar Precios</>}
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 max-w-5xl mx-auto w-full p-4 sm:p-6 space-y-8">

                            {/* Manual Mode Banner */}
                            {manualMode && (
                                <div className="bg-orange-50 dark:bg-orange-900/20 border border-orange-200 dark:border-orange-800 rounded-2xl p-4 flex items-center gap-3">
                                    <span className="text-2xl">⏸</span>
                                    <div>
                                        <p className="font-bold text-orange-700 dark:text-orange-400">Actualización automática pausada</p>
                                        <p className="text-sm text-orange-600 dark:text-orange-500">El scraping está desactivado. Los precios solo se actualizan desde este panel.</p>
                                    </div>
                                </div>
                            )}

                            {/* Price History */}
                            <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                                <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
                                    <h3 className="text-xl font-black text-slate-900 dark:text-white">Historial de Precios</h3>
                                    <select
                                        value={selectedHistMed}
                                        onChange={e => setSelectedHistMed(e.target.value)}
                                        className="p-2 text-sm bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"
                                    >
                                        {Object.keys(db).map(k => <option key={k} value={k}>{k}</option>)}
                                    </select>
                                </div>

                                {/* Last update cards */}
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
                                    {Object.keys(db).map(medName => {
                                        const info = lastUpdates[medName];
                                        const firstDose = info ? Object.entries(info.prices)[0] : null;
                                        return (
                                            <div key={medName} className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-3">
                                                <p className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 truncate">{medName}</p>
                                                {info ? (
                                                    <>
                                                        <p className="text-[10px] text-slate-400 mb-0.5">{info.date}</p>
                                                        {firstDose && <p className="text-xs font-bold text-slate-700 dark:text-slate-200">{formatCurrency(firstDose[1])}</p>}
                                                    </>
                                                ) : (
                                                    <p className="text-[10px] text-slate-400">Sin datos</p>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Chart */}
                                {historyLoading ? (
                                    <div className="h-48 flex items-center justify-center text-slate-400 text-sm">Cargando historial...</div>
                                ) : priceHistory.length === 0 ? (
                                    <div className="h-48 flex flex-col items-center justify-center text-slate-400 gap-1">
                                        <p className="font-semibold">Sin datos históricos aún</p>
                                        <p className="text-xs">El gráfico se completará a medida que el scraper actualice los precios.</p>
                                    </div>
                                ) : (
                                    <div className="relative h-64">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                )}
                            </div>

                            {/* Price Edit */}
                            <div className="space-y-4">
                                <div className="flex justify-between items-center bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                                    <div>
                                        <h3 className="text-xl font-black text-slate-900 dark:text-white">Lista de Precios (PVP)</h3>
                                        <p className="text-sm text-slate-500">Ingresa los valores numéricos sin puntos ni comas.</p>
                                    </div>
                                    <button onClick={restoreDefaults} className="text-xs font-semibold text-red-500 bg-red-50 dark:bg-red-900/20 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">
                                        Restaurar Defectos
                                    </button>
                                </div>
                                <div className="space-y-4 pb-20">
                                    {Object.keys(tempDb).map(medKey => (
                                        <div key={medKey} className="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                                            <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full ${tempDb[medKey].color}`}></div>
                                                <h4 className="font-bold text-lg text-slate-800 dark:text-slate-100">
                                                    {medKey} <span className="font-normal text-slate-500 text-sm ml-1">| {tempDb[medKey].lab}</span>
                                                </h4>
                                            </div>
                                            <div className="p-6 space-y-4">
                                                {tempDb[medKey].doses.map((dose, dIdx) => (
                                                    <div key={dIdx} className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                        <span className="text-sm font-medium text-slate-700 dark:text-slate-300 w-full sm:w-1/2">{dose.name}</span>
                                                        <div className="relative w-full sm:w-1/2">
                                                            <div className="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                                                <span className="text-slate-400 font-bold">$</span>
                                                            </div>
                                                            <input
                                                                type="number"
                                                                step="0.01"
                                                                value={dose.pvp ?? ''}
                                                                onChange={(e) => updatePrice(medKey, dIdx, e.target.value)}
                                                                className="w-full pl-9 pr-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-900 dark:text-white font-mono font-medium transition-all"
                                                                placeholder="Sin precio publicado"
                                                            />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Loading state
            if (loadingDb) {
                return <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900 dark:text-white"><div className="animate-pulse flex flex-col items-center"><Icons.Logo /><p className="mt-4 font-semibold">Cargando precios en vivo...</p></div></div>;
            }

            return (
                <div className="min-h-screen text-slate-800 dark:text-slate-100 transition-colors">
                    {/* MODAL GOOGLE LOGIN */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 rounded-[2rem] p-8 w-full max-w-sm shadow-2xl border border-slate-200 dark:border-slate-700 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>

                                <div className="w-12 h-12 bg-blue-50 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center text-blue-600 dark:text-blue-400 mb-6">
                                    <Icons.Lock />
                                </div>

                                <h3 className="text-2xl font-black text-slate-900 dark:text-white mb-2">Acceso Administrador</h3>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Iniciá sesión con tu cuenta de Google autorizada para modificar los precios.</p>

                                {authError && (
                                    <p className="text-red-500 text-xs font-semibold mb-4 p-3 bg-red-50 dark:bg-red-900/20 rounded-xl">
                                        {authError}
                                    </p>
                                )}

                                <div className="flex flex-col gap-3">
                                    <button
                                        onClick={handleGoogleLogin}
                                        disabled={authLoading}
                                        className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl font-bold border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition disabled:opacity-60 text-slate-700 dark:text-slate-200"
                                    >
                                        {authLoading ? (
                                            <span className="animate-spin w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full inline-block"></span>
                                        ) : (
                                            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.5 2.8 13.5l7.8 6C12.4 13.2 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.5A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.1.8-4.5l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.1-6.3z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-8.1 6.3C6.7 42.5 14.7 48 24 48z"/></svg>
                                        )}
                                        {authLoading ? "Iniciando sesión..." : "Continuar con Google"}
                                    </button>
                                    <button onClick={() => { setShowAuthModal(false); setAuthError(''); }} className="w-full py-3 rounded-xl font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white dark:bg-slate-800 border-b dark:border-slate-700 px-4 py-3 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer no-select" onClick={() => setClicks(c => c + 1)} title="Clic 5 veces para acceder al Administrador">
                                <span className="text-blue-500 flex-shrink-0"><Icons.Logo /></span>
                                <h1 className="text-sm sm:text-xl font-bold tracking-tight leading-tight">
                                    <span className="sm:hidden">Comparador GLP-1/GIP</span>
                                    <span className="hidden sm:inline">Comparador precios GLP-1/GIP Argentina</span>
                                </h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setTut(true)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition"><Icons.Help /></button>
                                <button onClick={() => setDark(!dark)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition">
                                    {dark ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </div>
                    </header>

                    {lastUpdated && (() => {
                        const daysOld = Math.floor((Date.now() - lastUpdated.getTime()) / 86400000);
                        return (
                            <div className="max-w-2xl mx-auto px-3 sm:px-4 pt-3 flex items-center gap-2 flex-wrap text-xs text-slate-400 dark:text-slate-500">
                                <span>Fuente: alfabeta.net · Actualizado: {lastUpdated.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' })}</span>
                                {daysOld > 7 && (
                                    <span className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400 font-bold">
                                        ⚠ Hace {daysOld} días sin actualizar — los precios pueden estar desactualizados
                                    </span>
                                )}
                            </div>
                        );
                    })()}

                    <main className="max-w-2xl mx-auto px-3 sm:px-4 py-3 space-y-3">
                        {/* Controles globales: afectan a toda la tabla comparativa */}
                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-3 space-y-2">
                            <div className="flex items-center gap-2">
                                <label className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide flex-shrink-0">OOSS / Prepaga</label>
                                <select
                                    value={ooss}
                                    onChange={e => setOoss(Number(e.target.value))}
                                    className="py-1.5 px-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold focus:ring-2 ring-blue-500 outline-none cursor-pointer ml-auto"
                                >
                                    {Array.from({ length: 21 }, (_, i) => i * 5).map(val => (
                                        <option key={val} value={val}>{val}%</option>
                                    ))}
                                </select>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => setUsePsp(!usePsp)} className={`flex items-center justify-center gap-2 py-2 px-2 rounded-xl text-xs sm:text-sm font-bold border transition ${usePsp ? 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/30' : 'bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700'}`}>
                                    <span className={`w-2 h-2 rounded-full ${usePsp ? 'bg-white' : 'bg-slate-300 dark:bg-slate-600'}`}></span>
                                    Descuento PSP
                                </button>
                                <button onClick={() => setIsMonthly(!isMonthly)} className={`flex items-center justify-center gap-2 py-2 px-2 rounded-xl text-xs sm:text-sm font-bold border transition ${isMonthly ? 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/30' : 'bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700'}`}>
                                    <span className={`w-2 h-2 rounded-full ${isMonthly ? 'bg-white' : 'bg-slate-300 dark:bg-slate-600'}`}></span>
                                    Rendir 2 meses
                                </button>
                            </div>

                            <div className="flex items-center gap-2">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide flex-shrink-0">Meses</span>
                                <div className="grid grid-cols-3 gap-1.5 flex-1">
                                    {[{l:'1-2',v:1}, {l:'3-4',v:3}, {l:'5+',v:5}].map(b => (
                                        <button key={b.v} onClick={() => setMonth(b.v)} className={`py-1.5 text-xs font-bold rounded-lg border transition ${month === b.v ? 'bg-slate-800 dark:bg-white text-white dark:text-slate-900 border-slate-800 dark:border-white' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>
                                            {b.l}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Tabla comparativa de todos los productos — protagonista */}
                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
                            <div className="px-4 pt-4 pb-2 flex items-center justify-between gap-2">
                                <h2 className="text-base font-black flex items-center gap-2 text-slate-900 dark:text-white"><Icons.Pill /> Comparativa</h2>
                                <span className="flex-shrink-0 text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded-full">{isMonthly ? 'precio / mes' : 'precio / caja'}</span>
                            </div>

                            {/* Toggle de vista: por precio (ranking) o agrupada por laboratorio */}
                            <div className="mx-4 mb-2 grid grid-cols-2 gap-1 p-1 bg-slate-100 dark:bg-slate-700/50 rounded-xl">
                                <button onClick={() => setGrouped(false)} className={`py-1.5 text-xs font-bold rounded-lg transition ${!grouped ? 'bg-white dark:bg-slate-800 shadow text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'}`}>Por precio</button>
                                <button onClick={() => setGrouped(true)} className={`py-1.5 text-xs font-bold rounded-lg transition ${grouped ? 'bg-white dark:bg-slate-800 shadow text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'}`}>Por laboratorio</button>
                            </div>

                            {!grouped ? (
                                <div>
                                    {comparison.list.map(item => renderRow(item, false))}
                                    {comparison.pending.map((p, i) => renderPendingRow(p, 'p' + i))}
                                </div>
                            ) : (
                                <div>
                                    {comparison.byLab.map(g => {
                                        const LabGlyph = labGlyphFor(g.lab);
                                        return (
                                            <div key={g.lab}>
                                                <div className={`px-4 py-2 flex items-center gap-2.5 border-t border-slate-100 dark:border-slate-700/50 ${styleFor(g.color).tint}`}>
                                                    <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-white flex-shrink-0 shadow-sm ${styleFor(g.color).chip}`}><LabGlyph /></span>
                                                    <div className="min-w-0">
                                                        <div className="font-black text-sm text-slate-900 dark:text-white leading-tight">{g.lab}</div>
                                                        <div className="text-[10px] text-slate-400 leading-tight">{g.rows.length + g.pending.length} presentaciones</div>
                                                    </div>
                                                </div>
                                                {g.rows.map(item => renderRow(item, true))}
                                                {g.pending.map((p, i) => renderPendingRow(p, g.lab + '-p' + i))}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            <p className="text-[10px] text-slate-400 px-4 py-3 border-t border-slate-100 dark:border-slate-700/50 leading-tight">
                                Tocá una fila para ver el desglose y compartirlo. {grouped ? 'Agrupado por laboratorio.' : `Ordenado de menor a mayor ${isMonthly ? 'precio por mes' : 'precio por caja'}.`}
                            </p>
                        </div>
                    </main>

                    {/* Ficha de detalle: bottom sheet en mobile, modal centrado en desktop */}
                    {detailOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setDetailOpen(false)}></div>
                            <div className="relative bg-white dark:bg-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto">
                                <div className={`h-2 ${current.color} w-full`}></div>
                                <div className="p-5 sm:p-6">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="min-w-0">
                                            <h2 className="text-2xl font-black text-slate-900 dark:text-white truncate">{med}</h2>
                                            <p className="text-slate-400 text-sm">{activeDose.name} · {current.lab}</p>
                                        </div>
                                        <button onClick={() => setDetailOpen(false)} className="p-2 -m-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex-shrink-0"><Icons.Close /></button>
                                    </div>

                                    {current.doses.length > 1 && (
                                        <div className="flex gap-1.5 overflow-x-auto pb-2 mb-1 -mx-1 px-1">
                                            {current.doses.map((d, i) => (
                                                <button key={i} onClick={() => setDoseIdx(i)} className={`whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full border flex-shrink-0 transition ${i === doseIdx ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-transparent' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>
                                                    {shortDose(d.name)}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {!activeDose.pvp ? (
                                        <div className="border-t border-slate-100 dark:border-slate-700 py-10 mt-2 text-center">
                                            <p className="text-lg font-bold text-slate-500 dark:text-slate-400">Precio aún no publicado</p>
                                            <p className="text-xs text-slate-400 mt-2 max-w-sm mx-auto">Esta presentación todavía no tiene PVP informado en alfabeta.net. Va a aparecer acá automáticamente apenas el laboratorio lo publique.</p>
                                        </div>
                                    ) : (<React.Fragment>
                                        <div className="space-y-3 border-t border-b border-slate-100 dark:border-slate-700 py-4 my-3">
                                            <div className="flex justify-between items-center text-slate-500 dark:text-slate-400">
                                                <span className="text-sm">Precio Venta Público (PVP)</span>
                                                <span className="font-bold text-slate-700 dark:text-slate-200">{formatCurrency(res.pvp)}</span>
                                            </div>
                                            {usePsp && current.hasPsp ? (
                                                <div className="flex justify-between items-center text-blue-600 dark:text-blue-400">
                                                    <span className="text-sm">Descuento PSP ({current.psp} - {(res.pspPerc*100).toFixed(0)}%)</span>
                                                    <span className="font-bold">- {formatCurrency(res.pspAmt)}</span>
                                                </div>
                                            ) : (
                                                <div className="flex justify-between items-center text-slate-300 dark:text-slate-600 line-through text-sm italic">
                                                    <span>Descuento PSP</span>
                                                    <span>No aplicado</span>
                                                </div>
                                            )}
                                            {ooss > 0 && (
                                                <div className="flex justify-between items-center text-emerald-600 dark:text-emerald-400">
                                                    <span className="text-sm">OOSS / Prepaga/Farmacia ({ooss}%)</span>
                                                    <span className="font-bold">- {formatCurrency(res.oossAmt)}</span>
                                                </div>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="bg-slate-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-slate-100 dark:border-slate-700">
                                                <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1 tracking-wider">Total Caja</span>
                                                <div className="text-3xl font-black text-slate-900 dark:text-white">{formatCurrency(res.final)}</div>
                                            </div>
                                            {isMonthly && current.canSplit && (
                                                <div className="bg-blue-50 dark:bg-blue-900/20 p-5 rounded-2xl border border-blue-100 dark:border-blue-900/50">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-blue-600"><Icons.Split /></span>
                                                        <span className="text-[10px] uppercase font-bold text-blue-600 dark:text-blue-400 tracking-wider">Por mes</span>
                                                    </div>
                                                    <div className="text-3xl font-black text-blue-600 dark:text-blue-400">{formatCurrency(res.perMonth)}</div>
                                                    <p className="text-[9px] text-blue-500/70 mt-1 font-medium">Rinde 2 meses por lapicera</p>
                                                </div>
                                            )}
                                        </div>

                                        {savings > 0 && (
                                            <div className="mt-3 flex items-center justify-between gap-3 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-900/40 rounded-2xl p-4">
                                                <div>
                                                    <span className="text-[10px] uppercase font-bold text-emerald-600 dark:text-emerald-400 tracking-wider block mb-1">Tu ahorro vs PVP</span>
                                                    <div className="text-2xl font-black text-emerald-600 dark:text-emerald-400">{formatCurrency(savings)}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-3xl font-black text-emerald-600 dark:text-emerald-400">{savingsPct.toFixed(0)}%</div>
                                                    <span className="text-[10px] text-emerald-500/80 font-medium">menos que el PVP</span>
                                                </div>
                                            </div>
                                        )}

                                        <div className="mt-3 flex flex-wrap gap-3">
                                            <button onClick={shareResult} className="flex-1 min-w-[130px] flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold active:scale-[0.98] transition shadow-lg">
                                                <Icons.Share /> Compartir
                                            </button>
                                            <button onClick={copyResult} className="flex-1 min-w-[130px] flex items-center justify-center gap-2 py-3 px-4 rounded-2xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 font-bold text-slate-700 dark:text-slate-200 transition">
                                                {copied ? <React.Fragment><Icons.Check /> ¡Copiado!</React.Fragment> : <React.Fragment><Icons.Copy /> Copiar resumen</React.Fragment>}
                                            </button>
                                        </div>
                                    </React.Fragment>)}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdmin && <AdminPanel />}

                    {tut && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                                <button onClick={closeTut} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-slate-600 transition"><Icons.Close /></button>
                                <div className="p-10">
                                    <div className="w-16 h-16 bg-blue-500 rounded-3xl flex items-center justify-center mb-6 text-white shadow-lg shadow-blue-500/30">
                                        <Icons.Logo />
                                    </div>
                                    <h2 className="text-3xl font-black mb-4 text-slate-900 dark:text-white">Bienvenido al Comparador GLP-1</h2>
                                    <p className="text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">
                                        Esta herramienta interactiva te permite comparar los costos de los medicamentos GLP-1 más comunes en Argentina, aplicando descuentos de laboratorios (PSP) y farmacias.
                                    </p>
                                    
                                    <div className="space-y-6">
                                        <div className="flex gap-4">
                                            <div className="text-blue-500 mt-1"><Icons.Split /></div>
                                            <div>
                                                <h4 className="font-bold text-sm text-slate-800 dark:text-slate-200">Conteo de Clics</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Activar "Mensualizar" para ver cuánto cuesta el mes de tratamiento, contando los clics y usando cada lapicera 2 meses(Mounjaro, Ozempic, Wegovy).</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="text-emerald-500 mt-1"><Icons.Sun /></div>
                                            <div>
                                                <h4 className="font-bold text-sm text-slate-800 dark:text-slate-200">Lógica de Descuento</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Primero configuramos el descuento de OOSS/Prepaga y el sistema calculará automáticamente el PSP sobre el saldo restante.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={closeTut} className="w-full mt-10 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-black py-4 rounded-2xl hover:scale-[1.02] transition shadow-xl">ENTENDIDO</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

const mergeDb = (base, remote) => {
  if (!remote) return base;
  const merged = {};
  Object.keys(base).forEach(k => {
    if (!remote[k]) {
      merged[k] = base[k];
      return;
    }
    const remoteDoses = remote[k].doses || [];
    const doses = base[k].doses.map(d => remoteDoses.find(rd => rd.name === d.name) || d);
    remoteDoses.forEach(rd => {
      if (!doses.some(d => d.name === rd.name)) doses.push(rd);
    });
    merged[k] = {
      ...base[k],
      ...remote[k],
      doses
    };
  });
  Object.keys(remote).forEach(k => {
    if (!merged[k]) merged[k] = remote[k];
  });
  return merged;
};

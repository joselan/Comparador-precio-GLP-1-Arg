        const defaultDb = {
            Mounjaro: { lab: 'Adium', psp: 'Con Voz', hasPsp: true, pspType: 'fixed', pspValue: 0.30, canSplit: true, color: 'bg-blue-600', doses: [ { name: '2.5mg (KwikPen x1)', pvp: 612576.68 }, { name: '5mg (KwikPen x1)', pvp: 829980.63 }, { name: '7.5mg (KwikPen x1)', pvp: null }, { name: '10mg (KwikPen x1)', pvp: null } ] },

            Wegovy: { lab: 'Novo Nordisk', psp: 'Novo a la Par', hasPsp: true, pspType: 'fixed', pspValue: 0.30, canSplit: true, color: 'bg-teal-500', doses: [ { name: '0.25mg (1.5ml + 4 ag)', pvp: 322213.46 }, { name: '0.5mg (1.5ml + 4 ag)', pvp: 322213.46 }, { name: '1mg (3ml + 4 ag)', pvp: 386656.15 }, { name: '1.7mg (3ml + 4 ag)', pvp: 541318.63 }, { name: '2.4mg (3ml + 4 ag)', pvp: 757846.07 } ] },
            Dutide: { lab: 'Elea', psp: '-', hasPsp: false, canSplit: false, color: 'bg-purple-600', doses: [ { name: '0.25mg (x4)', pvp: 114334.23 }, { name: '0.5mg (x4)', pvp: 131478.58 }, { name: '1mg (x4)', pvp: 148738.76 } ] },
            Obetide: { lab: 'Elea', psp: '-', hasPsp: false, canSplit: false, color: 'bg-purple-500', doses: [ { name: '0.25mg (x4)', pvp: 114334.23 }, { name: '0.5mg (x4)', pvp: 131478.58 }, { name: '1mg (x4)', pvp: 148738.76 }, { name: '1.7mg (x4)', pvp: 196450.34 }, { name: '2.4mg (x4)', pvp: 256527.14 } ] }
        };

        const formatCurrency = (val) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(val);
        // Versión compacta (sin centavos) para la tabla comparativa en pantallas chicas
        const formatCompact = (val) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);
        // Nombre de dosis abreviado: "5mg (KwikPen x1)" → "5mg"
        const shortDose = (name) => name.split(' (')[0];

        // Estilos derivados del color del producto (chip sólido + fondo tenue para encabezados)
        const colorStyles = {
            'bg-blue-600':   { chip: 'bg-blue-600',   tint: 'bg-blue-50 dark:bg-blue-900/20' },
            'bg-teal-600':   { chip: 'bg-teal-600',   tint: 'bg-teal-50 dark:bg-teal-900/20' },
            'bg-teal-500':   { chip: 'bg-teal-500',   tint: 'bg-teal-50 dark:bg-teal-900/20' },
            'bg-purple-600': { chip: 'bg-purple-600', tint: 'bg-purple-50 dark:bg-purple-900/20' },
            'bg-purple-500': { chip: 'bg-purple-500', tint: 'bg-purple-50 dark:bg-purple-900/20' },
        };
        const styleFor = (c) => colorStyles[c] || { chip: c || 'bg-slate-400', tint: 'bg-slate-50 dark:bg-slate-800' };

        // Ícono por producto y por laboratorio
        const productGlyph = { Mounjaro: Icons.Pen, Ozempic: Icons.Droplet, Wegovy: Icons.Droplet, Dutide: Icons.Capsule, Obetide: Icons.Capsule };
        const labGlyph = { 'Adium': Icons.Pen, 'Novo Nordisk': Icons.Droplet, 'Elea': Icons.Capsule };
        const glyphFor = (name) => productGlyph[name] || Icons.Pill;
        const labGlyphFor = (lab) => labGlyph[lab] || Icons.Pill;

        // Logos de laboratorio (carpeta Imagenes del repo)
        const labLogo = {
            'Adium': 'Imagenes/Logo-adium-h-400.png',
            'Novo Nordisk': 'Imagenes/novo-nordisk-logo-1.svg',
            'Elea': 'Imagenes/images.png',
        };
        // Color de la barra de precio por laboratorio: Elea celeste claro,
        // Novo azul oscuro, Adium violeta.
        const labBarColor = {
            'Elea': 'bg-sky-400',
            'Novo Nordisk': 'bg-blue-800',
            'Adium': 'bg-violet-600',
        };
        const barColorFor = (lab) => labBarColor[lab] || 'bg-slate-400';
        // Imagen de producto por dosis (si existe) o representativa del producto
        const IMG = 'Imagenes/';
        const doseImg = {

            'Mounjaro|5mg (KwikPen x1)':   IMG + 'farmaciasjulios_panama-mounjaro-kwikpen-5mg-0-6ml-solucion-inyectable-de-tirzepatida.jpg',
            'Mounjaro|7.5mg (KwikPen x1)': IMG + 'farmaciasjulios_panama-mounjaro-kwikpen-7-5mg-0-6ml-solucion-inyectable-de-tirzepatida.jpg',

        const productImg = {

        };
        const imgFor = (label, dose) => doseImg[label + '|' + dose] || productImg[label] || null;

        // --- Descuentos PSP (Programas de Soporte a Pacientes) ---
        // Novo a la Par: 30% fijo sobre el saldo tras OOSS para Ozempic y Wegovy.
        //   Excepción: Wegovy 0.25 mg = 60% del 06/05/2026 al 31/07/2026 inclusive,
        //   luego vuelve al 30% general (fuente: Términos y Condiciones, abril 2026).
        // Adium (Con Voz): 30% fijo. Elea: sin PSP.
        const promoWegovy025Active = () => {
            const now = new Date();
            const start = new Date('2026-05-06T00:00:00-03:00');
            const end = new Date('2026-08-01T00:00:00-03:00'); // 31/07/2026 inclusive
            return now >= start && now < end;
        };
        const pspPercFor = (productName, item, doseName, activePsp) => {
            if (!activePsp || !item || !item.hasPsp) return 0;
            // Promo Wegovy 0.25 mg
            if (productName === 'Wegovy' && shortDose(doseName) === '0.25mg' && promoWegovy025Active()) return 0.60;
            // PSP fijo declarado (ej. Con Voz de Adium)
            if (item.pspType === 'fixed' && typeof item.pspValue === 'number') return item.pspValue;
            // Novo a la Par (y cualquier otro con PSP): 30% fijo
            return 0.30;
        };

        // Recetario Solidario: 20% extra SOLO en productos de Novo Nordisk.
        // Según los Términos y Condiciones de Novo, es el único beneficio que se
        // acumula con Novo a la Par, y aplica sobre el saldo ya descontado.
        const recetarioPercFor = (item, active) =>
            (active && item && item.lab === 'Novo Nordisk') ? 0.20 : 0;

        // Combina la BD local (estructura de referencia: productos y dosis nuevos
        // definidos en el código) con la de Firebase (precios vigentes). Los precios
        // de Firebase mandan; las dosis que aún no existen en Firebase se agregan
        // desde defaultDb para que aparezcan sin esperar una publicación manual.
        const mergeDb = (base, remote) => {
            if (!remote) return base;
            const merged = {};
            Object.keys(base).forEach(k => {
                if (!remote[k]) { merged[k] = base[k]; return; }
                const remoteDoses = remote[k].doses || [];
                const doses = base[k].doses.map(d => remoteDoses.find(rd => rd.name === d.name) || d);
                remoteDoses.forEach(rd => { if (!doses.some(d => d.name === rd.name)) doses.push(rd); });
                merged[k] = { ...base[k], ...remote[k], doses };
            });
            Object.keys(remote).forEach(k => { if (!merged[k]) merged[k] = remote[k]; });
            return merged;
        };

        function App() {
            // Estado Principal de la BD
            const [db, setDb] = useState(defaultDb);
            const [loadingDb, setLoadingDb] = useState(true);
            const [lastUpdated, setLastUpdated] = useState(null);

            // Estados de la Calculadora
            const [med, setMed] = useState('Mounjaro');
            const [doseIdx, setDoseIdx] = useState(0);
            const [ooss, setOoss] = useState(0);
            const [usePsp, setUsePsp] = useState(true);
            const [recetario, setRecetario] = useState(false);
            const [isMonthly, setIsMonthly] = useState(false);
            const [dark, setDark] = useState(false);
            const [tut, setTut] = useState(false);
            const [copied, setCopied] = useState(false);
            const [detailOpen, setDetailOpen] = useState(false);
            const [grouped, setGrouped] = useState(false);
            const [optionsOpen, setOptionsOpen] = useState(false);
            const [showHistory, setShowHistory] = useState(false);

            // 1. Cargar datos en Tiempo Real desde Firebase
            useEffect(() => {
                const unsubscribe = firestore.collection('config').doc('prices')
                    .onSnapshot((doc) => {
                        if (doc.exists && doc.data().db) {
                            setDb(mergeDb(defaultDb, doc.data().db));
                            const lu = doc.data().lastUpdated;
                            setLastUpdated(lu && lu.toDate ? lu.toDate() : null);
                        } else {
                            // Si no existe, usamos los de defecto
                            setDb(defaultDb);
                        }
                        setLoadingDb(false);
                    }, (error) => {
                        console.error("Error obteniendo datos de Firebase:", error);
                        // Si falla Firebase (ej. config vacía), usa locales para que la app no se rompa
                        setDb(defaultDb); 
                        setLoadingDb(false);
                    });

                return () => unsubscribe();
            }, []);

            // El tutorial ya no aparece solo al abrir la app; queda disponible a
            // mano desde el menú (⋮ → "Cómo funciona").

            // 2b. Actualizar clase dark en el DOM al cambiar el modo
            useEffect(() => {
                if (dark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [dark]);

            const closeTut = () => setTut(false);

            // Orden de cálculo (según Novo a la Par y la regla original):
            // 1) OOSS/Prepaga (Dto. extra) sobre el PVP → "saldo a abonar en mostrador"
            // 2) PSP (30%/60%) sobre ESE saldo
            // 3) Recetario Solidario (20% Novo) sobre el saldo ya con PSP
            // El total final es el mismo sin importar el orden (descuentos
            // multiplicativos), pero así el desglose refleja lo que hace el laboratorio.
            const calc = (pvp, item, pspPerc, oossPerc, monthly, recetarioPerc) => {
                const oossAmt = pvp * (oossPerc / 100);
                const saldoMostrador = pvp - oossAmt;         // precio a abonar en mostrador
                const pspAmt = saldoMostrador * pspPerc;      // PSP sobre el saldo post-OOSS
                const afterPsp = saldoMostrador - pspAmt;
                const recAmt = afterPsp * (recetarioPerc || 0); // Recetario Solidario sobre el saldo con PSP
                const final = afterPsp - recAmt;
                const perMonth = (monthly && item.canSplit) ? final / 2 : final;
                return { pvp, oossAmt, pspAmt, recAmt, final, perMonth, pspPerc, recetarioPerc: recetarioPerc || 0 };
            };

            const current = db[med] || defaultDb['Mounjaro'];
            const activeDose = current.doses[doseIdx] || current.doses[0];
            const res = calc(activeDose.pvp, current, pspPercFor(med, current, activeDose.name, usePsp), ooss, isMonthly, recetarioPercFor(current, recetario));

            // Ahorro respecto del PVP (lo que descuentan PSP + OOSS sobre la caja)
            const savings = res.pvp ? res.pvp - res.final : 0;
            const savingsPct = res.pvp ? (savings / res.pvp) * 100 : 0;

            // Resumen de texto para compartir/copiar el cálculo actual
            const buildShareText = () => {
                const lines = [];
                lines.push('💊 Comparador de precios GLP-1/GIP Argentina');
                lines.push(`${med} ${activeDose.name} — ${current.lab}`);
                lines.push(`PVP: ${formatCurrency(res.pvp)}`);
                if (ooss > 0) lines.push(`Dto. extra (${ooss}%): -${formatCurrency(res.oossAmt)}`);
                if (usePsp && current.hasPsp) lines.push(`Descuento PSP (${current.psp} ${(res.pspPerc * 100).toFixed(0)}%): -${formatCurrency(res.pspAmt)}`);
                if (res.recetarioPerc > 0) lines.push(`Recetario Solidario (20%): -${formatCurrency(res.recAmt)}`);
                lines.push(`Precio final de la caja: ${formatCurrency(res.final)}`);
                if (isMonthly && current.canSplit) lines.push(`Costo por mes (rinde 2 meses): ${formatCurrency(res.perMonth)}`);
                if (savings > 0) lines.push(`Ahorro vs PVP: ${formatCurrency(savings)} (${savingsPct.toFixed(0)}%)`);
                lines.push('');
                lines.push(`Calculá el tuyo: ${window.location.href}`);
                return lines.join('\n');
            };

            const shareResult = async () => {
                const text = buildShareText();
                if (navigator.share) {
                    try { await navigator.share({ title: 'Comparador GLP-1/GIP Argentina', text }); return; }
                    catch (e) { if (e.name === 'AbortError') return; }
                }
                window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
            };

            const copyResult = async () => {
                const text = buildShareText();
                const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
                try {
                    await navigator.clipboard.writeText(text);
                    done();
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); done(); } catch (_) {}
                    document.body.removeChild(ta);
                }
            };

            // Abre la ficha de detalle para un producto+dosis (desde la tabla)
            const openDetail = (label, dIdx) => {
                setMed(label);
                setDoseIdx(dIdx);
                setDetailOpen(true);
            };

            const comparison = useMemo(() => {
                let list = [];
                let pending = [];
                Object.keys(db).forEach(k => {
                    db[k].doses.forEach((d, di) => {
                        // Dosis sin PVP publicado aún: no entran al ranking
                        if (!d.pvp) { pending.push({ label: k, dose: d.name, dIdx: di, color: db[k].color, lab: db[k].lab }); return; }
                        const r = calc(d.pvp, db[k], pspPercFor(k, db[k], d.name, usePsp), ooss, isMonthly, recetarioPercFor(db[k], recetario));
                        list.push({ label: k, dose: d.name, dIdx: di, ...r, color: db[k].color, canSplit: db[k].canSplit, lab: db[k].lab });
                    });
                });
                list.sort((a, b) => a.perMonth - b.perMonth);

                // Agrupado por laboratorio (grupos ordenados por su dosis más barata)
                const labGroups = {};
                const order = [];
                Object.keys(db).forEach(k => {
                    const lab = db[k].lab;
                    if (!labGroups[lab]) { labGroups[lab] = { lab, color: db[k].color, rows: [], pending: [] }; order.push(lab); }
                });
                list.forEach(it => labGroups[it.lab] && labGroups[it.lab].rows.push(it));
                pending.forEach(p => labGroups[p.lab] && labGroups[p.lab].pending.push(p));
                const byLab = order.map(l => labGroups[l])
                    .filter(g => g.rows.length || g.pending.length)
                    .map(g => ({ ...g, min: g.rows.length ? Math.min(...g.rows.map(r => r.perMonth)) : Infinity }))
                    .sort((a, b) => a.min - b.min);

                return { list, pending, byLab };
            }, [db, med, doseIdx, ooss, usePsp, isMonthly, recetario]);

            // Precio máximo del ranking, para escalar las barras visuales de la tabla
            const maxComparePrice = comparison.list.reduce((m, it) => Math.max(m, it.perMonth), 0) || 1;

            // Fila de la tabla (compartida entre la vista por precio y por laboratorio)
            const renderRow = (item) => {
                const st = styleFor(item.color);
                const Glyph = glyphFor(item.label);
                const selected = detailOpen && item.label === med && item.dose === activeDose.name;
                return (
                    <button key={item.label + item.dose} onClick={() => openDetail(item.label, item.dIdx)} className={`w-full text-left flex items-center gap-3 px-4 py-2.5 border-t border-slate-100 dark:border-slate-700/50 active:bg-slate-100 dark:active:bg-slate-700/40 transition ${selected ? 'bg-blue-50/80 dark:bg-blue-900/25' : ''}`}>
                        {imgFor(item.label, item.dose)
                            ? <span className="w-11 h-11 rounded-xl bg-white border border-slate-200 dark:border-slate-600 flex items-center justify-center flex-shrink-0 overflow-hidden p-0.5 shadow-sm"><img src={imgFor(item.label, item.dose)} alt={item.label} className="max-w-full max-h-full object-contain" loading="lazy" /></span>
                            : <span className={`w-11 h-11 rounded-xl flex items-center justify-center text-white flex-shrink-0 shadow-sm ${st.chip}`}><Glyph /></span>}
                        <div className="min-w-0 flex-1">
                            <div className="flex items-baseline justify-between gap-2">
                                <span className="truncate min-w-0">
                                    <span className="font-bold text-sm text-slate-900 dark:text-white">{item.label}</span>
                                    <span className="text-[13px] text-slate-400"> {shortDose(item.dose)}</span>
                                </span>
                                <span className="font-black text-sm tabular-nums flex-shrink-0 text-slate-900 dark:text-white">{formatCompact(item.perMonth)}</span>
                            </div>
                            <div className="mt-2 h-1.5 rounded-full bg-slate-100 dark:bg-slate-700/60 overflow-hidden">
                                <div className={`h-full rounded-full ${barColorFor(item.lab)}`} style={{ width: Math.max(6, (item.perMonth / maxComparePrice) * 100) + '%' }}></div>
                            </div>
                        </div>
                    </button>
                );
            };

            const renderPendingRow = (p, key) => {
                const Glyph = glyphFor(p.label);
                return (
                    <div key={key} className="w-full flex items-center gap-3 px-4 py-2.5 border-t border-slate-100 dark:border-slate-700/50 opacity-60">
                        {imgFor(p.label, p.dose)
                            ? <span className="w-11 h-11 rounded-xl bg-white border border-slate-200 dark:border-slate-600 flex items-center justify-center flex-shrink-0 overflow-hidden p-0.5"><img src={imgFor(p.label, p.dose)} alt={p.label} className="max-w-full max-h-full object-contain" loading="lazy" /></span>
                            : <span className={`w-11 h-11 rounded-xl flex items-center justify-center text-white flex-shrink-0 ${styleFor(p.color).chip}`}><Glyph /></span>}
                        <p className="min-w-0 flex-1 truncate">
                            <span className="font-bold text-sm text-slate-700 dark:text-slate-300">{p.label}</span>
                            <span className="text-[13px] text-slate-400"> {shortDose(p.dose)}</span>
                        </p>
                        <span className="text-[12px] font-semibold text-slate-400 flex-shrink-0">Sin precio aún</span>
                    </div>
                );
            };

            // --- PANEL ADMINISTRADOR ---
            // Modal de historial de precios (solo lectura, sin login).
            // Lee la colección pública priceHistory y dibuja el gráfico con Chart.js.
            const HistoryModal = () => {
                const [priceHistory, setPriceHistory] = useState([]);
                const [historyLoading, setHistoryLoading] = useState(true);
                const [selectedHistMed, setSelectedHistMed] = useState(Object.keys(db)[0] || 'Mounjaro');
                const chartRef = useRef(null);
                const chartInstance = useRef(null);

                useEffect(() => {
                    firestore.collection('priceHistory')
                        .orderBy('timestamp', 'desc')
                        .limit(366) // hasta ~1 año de puntos (snapshot diario/semanal)
                        .get()
                        .then(snapshot => {
                            const hist = [];
                            snapshot.forEach(d => hist.push({ id: d.id, ...d.data() }));
                            setPriceHistory(hist.reverse());
                            setHistoryLoading(false);
                        }).catch(() => setHistoryLoading(false));
                }, []);

                useEffect(() => {
                    if (historyLoading || !chartRef.current || priceHistory.length === 0) return;
                    const medData = db[selectedHistMed];
                    if (!medData) return;
                    const labels = priceHistory.map(h => h.id);
                    const palette = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'];
                    const datasets = medData.doses.map((dose, i) => ({
                        label: dose.name,
                        data: priceHistory.map(h => h[selectedHistMed]?.[dose.name] || null),
                        borderColor: palette[i % palette.length],
                        backgroundColor: palette[i % palette.length] + '22',
                        tension: 0.4, fill: false, spanGaps: true,
                    }));
                    if (chartInstance.current) chartInstance.current.destroy();
                    chartInstance.current = new Chart(chartRef.current, {
                        type: 'line',
                        data: { labels, datasets },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } } },
                            scales: {
                                x: { ticks: { autoSkip: true, maxTicksLimit: 8, maxRotation: 0, font: { size: 10 } } },
                                y: { ticks: { callback: v => '$' + new Intl.NumberFormat('es-AR').format(v) } }
                            }
                        }
                    });
                    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
                }, [priceHistory, selectedHistMed, historyLoading]);

                const lastUpdates = {};
                if (priceHistory.length > 0) {
                    Object.keys(db).forEach(medName => {
                        for (let i = priceHistory.length - 1; i >= 0; i--) {
                            if (priceHistory[i][medName]) {
                                lastUpdates[medName] = { date: priceHistory[i].id, prices: priceHistory[i][medName] };
                                break;
                            }
                        }
                    });
                }

                return (
                    <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center">
                        <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowHistory(false)}></div>
                        <div className="relative bg-white dark:bg-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto p-5 sm:p-6">
                            <div className="flex justify-between items-center mb-4 gap-2">
                                <h2 className="text-xl font-black text-slate-900 dark:text-white">Historial de precios</h2>
                                <div className="flex items-center gap-2 flex-shrink-0">
                                    <select value={selectedHistMed} onChange={e => setSelectedHistMed(e.target.value)} className="p-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none font-semibold cursor-pointer">
                                        {Object.keys(db).map(k => <option key={k} value={k}>{k}</option>)}
                                    </select>
                                    <button onClick={() => setShowHistory(false)} className="p-2 -m-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icons.Close /></button>
                                </div>
                            </div>

                            {/* Última actualización por producto */}
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-4">
                                {Object.keys(db).map(medName => {
                                    const info = lastUpdates[medName];
                                    const firstDose = info ? Object.entries(info.prices)[0] : null;
                                    return (
                                        <div key={medName} className="bg-slate-50 dark:bg-slate-900/60 rounded-2xl p-3 border border-slate-100 dark:border-slate-700">
                                            <p className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 truncate">{medName}</p>
                                            {info ? (
                                                <React.Fragment>
                                                    <p className="text-[12px] text-slate-400 mb-0.5">{info.date}</p>
                                                    {firstDose && <p className="text-xs font-bold text-slate-700 dark:text-slate-200">{formatCurrency(firstDose[1])}</p>}
                                                </React.Fragment>
                                            ) : (
                                                <p className="text-[12px] text-slate-400">Sin datos</p>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Gráfico */}
                            {historyLoading ? (
                                <div className="h-48 flex items-center justify-center text-slate-400 text-sm">Cargando historial...</div>
                            ) : priceHistory.length === 0 ? (
                                <div className="h-48 flex flex-col items-center justify-center text-slate-400 gap-1 text-center px-4">
                                    <p className="font-semibold">Sin datos históricos aún</p>
                                    <p className="text-xs">El gráfico se completa a medida que el scraper actualiza los precios.</p>
                                </div>
                            ) : (
                                <div className="relative h-64">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // Loading state
            if (loadingDb) {
                return <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900 dark:text-white"><div className="animate-pulse flex flex-col items-center"><Icons.Logo /><p className="mt-4 font-semibold">Cargando precios en vivo...</p></div></div>;
            }

            return (
                <div className="min-h-screen text-slate-800 dark:text-slate-100 transition-colors">
                    {/* Contenido: la comparativa ocupa toda la parte de arriba */}
                    <main className="max-w-2xl mx-auto px-3 sm:px-4 pt-3 pb-40 space-y-3">
                        {/* Tabla comparativa — protagonista (sin título ni selector arriba) */}
                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
                            {!grouped ? (
                                <div>
                                    {comparison.list.map(item => renderRow(item))}
                                    {comparison.pending.map((p, i) => renderPendingRow(p, 'p' + i))}
                                </div>
                            ) : (
                                <div>
                                    {comparison.byLab.map(g => (
                                        <div key={g.lab}>
                                            <div className={`px-4 py-2.5 flex items-center justify-between gap-2.5 border-t border-slate-100 dark:border-slate-700/50 ${styleFor(g.color).tint}`}>
                                                <div className="bg-white rounded-lg px-2.5 py-1.5 shadow-sm flex items-center">
                                                    <img src={labLogo[g.lab]} alt={g.lab} className="h-5 w-auto object-contain" style={{ maxWidth: '130px' }} />
                                                </div>
                                                <span className="text-[12px] font-bold text-slate-500 dark:text-slate-300">{g.rows.length + g.pending.length} presentaciones</span>
                                            </div>
                                            {g.rows.map(item => renderRow(item))}
                                            {g.pending.map((p, i) => renderPendingRow(p, g.lab + '-p' + i))}
                                        </div>
                                    ))}
                                </div>
                            )}

                            <p className="text-[12px] text-slate-400 px-4 py-3 border-t border-slate-100 dark:border-slate-700/50 leading-tight">
                                Tocá una fila para ver el desglose y compartirlo. {grouped ? 'Agrupado por laboratorio.' : `Ordenado de menor a mayor ${isMonthly ? 'precio por mes' : 'precio por caja'}.`}
                            </p>
                        </div>

                        {/* Fuente al final, después de todas las etiquetas */}
                        {lastUpdated && (() => {
                            const daysOld = Math.floor((Date.now() - lastUpdated.getTime()) / 86400000);
                            return (
                                <div className="flex items-center justify-center gap-2 flex-wrap text-[13px] text-slate-400 dark:text-slate-500 text-center">
                                    <span>Fuente: alfabeta.net · Actualizado: {lastUpdated.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' })}</span>
                                    {daysOld > 7 && (
                                        <span className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400 font-bold">⚠ Hace {daysOld} días sin actualizar</span>
                                    )}
                                </div>
                            );
                        })()}
                    </main>

                    {/* Fondo para cerrar el menú de opciones al tocar afuera */}
                    {optionsOpen && <div className="fixed inset-0 z-30" onClick={() => setOptionsOpen(false)}></div>}

                    {/* Barra inferior fija: todos los controles al alcance del pulgar */}
                    <div className="fixed inset-x-0 bottom-0 z-40">
                        <div className="max-w-2xl mx-auto px-3">
                            {optionsOpen && (
                                <div className="mb-2 ml-auto w-64 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-2">
                                    <button onClick={() => { setShowHistory(true); setOptionsOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm transition">
                                        <Icons.Chart /> Historial de precios
                                    </button>
                                    <button onClick={() => { setTut(true); setOptionsOpen(false); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm transition">
                                        <Icons.Help /> Cómo funciona
                                    </button>
                                    <button onClick={() => setDark(!dark)} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm transition">
                                        {dark ? <Icons.Sun /> : <Icons.Moon />} Tema {dark ? 'claro' : 'oscuro'}
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="bg-white/95 dark:bg-slate-800/95 backdrop-blur border-t border-slate-200 dark:border-slate-700 shadow-[0_-6px_24px_rgba(0,0,0,0.08)]">
                            <div className="max-w-2xl mx-auto p-3 space-y-2" style={{ paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom))' }}>
                                {/* Fila 1: descuento extra + vista + menú */}
                                <div className="flex items-center gap-2">
                                    <label className="text-[13px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide flex-shrink-0">Dto. extra</label>
                                    <select value={ooss} onChange={e => setOoss(Number(e.target.value))} className="py-1.5 px-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold focus:ring-2 ring-blue-500 outline-none cursor-pointer">
                                        {Array.from({ length: 21 }, (_, i) => i * 5).map(val => (
                                            <option key={val} value={val}>{val}%</option>
                                        ))}
                                    </select>
                                    <button onClick={() => setGrouped(g => !g)} className="ml-auto flex-shrink-0 py-2 px-2.5 rounded-xl text-[13px] font-bold border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 bg-slate-50 dark:bg-slate-900 active:scale-95 transition" aria-label="Cambiar vista: por precio o por laboratorio">
                                        {grouped ? 'Por lab.' : 'Por precio'}
                                    </button>
                                    <button onClick={() => setOptionsOpen(o => !o)} className={`w-9 h-9 flex items-center justify-center rounded-xl border flex-shrink-0 transition ${optionsOpen ? 'bg-slate-800 dark:bg-white text-white dark:text-slate-900 border-transparent' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300'}`} aria-label="Opciones">
                                        <Icons.Dots />
                                    </button>
                                </div>

                                {/* Fila 2: los tres toggles (el color azul indica activo).
                                    Anchos proporcionales para que "Rendir 2 meses" entre en una línea. */}
                                <div className="grid grid-cols-[1fr_1.35fr_1.15fr] gap-2">
                                    <button onClick={() => setUsePsp(!usePsp)} className={`py-2 px-1.5 rounded-xl text-[13px] font-bold border transition whitespace-nowrap ${usePsp ? 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/30' : 'bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700'}`}>
                                        Dto. PSP
                                    </button>
                                    <button onClick={() => setIsMonthly(!isMonthly)} className={`py-2 px-1.5 rounded-xl text-[13px] font-bold border transition whitespace-nowrap ${isMonthly ? 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/30' : 'bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700'}`}>
                                        Rendir 2 meses
                                    </button>
                                    <button onClick={() => setRecetario(!recetario)} className={`py-2 px-1.5 rounded-xl text-[13px] font-bold border transition whitespace-nowrap ${recetario ? 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/30' : 'bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700'}`}>
                                        Rx Solidario
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Ficha de detalle: bottom sheet en mobile, modal centrado en desktop */}
                    {detailOpen && (
                        <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setDetailOpen(false)}></div>
                            <div className="relative bg-white dark:bg-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto">
                                <div className={`h-2 ${current.color} w-full`}></div>
                                <div className="p-5 sm:p-6">
                                    <div className="flex justify-between items-start mb-4 gap-3">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <div className="w-20 h-20 bg-white rounded-2xl border border-slate-200 dark:border-slate-600 flex items-center justify-center flex-shrink-0 overflow-hidden p-1">
                                                {imgFor(med, activeDose.name)
                                                    ? <img src={imgFor(med, activeDose.name)} alt={med} className="max-w-full max-h-full object-contain" />
                                                    : <span className={`w-10 h-10 rounded-lg flex items-center justify-center text-white ${styleFor(current.color).chip}`}>{React.createElement(glyphFor(med))}</span>}
                                            </div>
                                            <div className="min-w-0">
                                                <h2 className="text-2xl font-black text-slate-900 dark:text-white truncate">{med}</h2>
                                                <p className="text-slate-500 dark:text-slate-300 text-sm font-medium">{activeDose.name}</p>
                                                <p className="text-slate-400 text-xs">{current.lab}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setDetailOpen(false)} className="p-2 -m-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex-shrink-0"><Icons.Close /></button>
                                    </div>

                                    {current.doses.length > 1 && (
                                        <div className="flex gap-1.5 overflow-x-auto pb-2 mb-1 -mx-1 px-1">
                                            {current.doses.map((d, i) => (
                                                <button key={i} onClick={() => setDoseIdx(i)} className={`whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full border flex-shrink-0 transition ${i === doseIdx ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-transparent' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>
                                                    {shortDose(d.name)}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {!activeDose.pvp ? (
                                        <div className="border-t border-slate-100 dark:border-slate-700 py-10 mt-2 text-center">
                                            <p className="text-lg font-bold text-slate-500 dark:text-slate-400">Precio aún no publicado</p>
                                            <p className="text-xs text-slate-400 mt-2 max-w-sm mx-auto">Esta presentación todavía no tiene PVP informado en alfabeta.net. Va a aparecer acá automáticamente apenas el laboratorio lo publique.</p>
                                        </div>
                                    ) : (<React.Fragment>
                                        <div className="space-y-3 border-t border-b border-slate-100 dark:border-slate-700 py-4 my-3">
                                            <div className="flex justify-between items-center text-slate-500 dark:text-slate-400">
                                                <span className="text-sm">Precio Venta Público (PVP)</span>
                                                <span className="font-bold text-slate-700 dark:text-slate-200">{formatCurrency(res.pvp)}</span>
                                            </div>
                                            {ooss > 0 && (
                                                <div className="flex justify-between items-center text-emerald-600 dark:text-emerald-400">
                                                    <span className="text-sm">Dto. extra ({ooss}%)</span>
                                                    <span className="font-bold">- {formatCurrency(res.oossAmt)}</span>
                                                </div>
                                            )}
                                            {usePsp && current.hasPsp ? (
                                                <div className="flex justify-between items-center text-blue-600 dark:text-blue-400">
                                                    <span className="text-sm">Descuento PSP ({current.psp} - {(res.pspPerc*100).toFixed(0)}%){ooss > 0 ? ' sobre saldo' : ''}</span>
                                                    <span className="font-bold">- {formatCurrency(res.pspAmt)}</span>
                                                </div>
                                            ) : (
                                                <div className="flex justify-between items-center text-slate-300 dark:text-slate-600 line-through text-sm italic">
                                                    <span>Descuento PSP</span>
                                                    <span>No aplicado</span>
                                                </div>
                                            )}
                                            {res.recetarioPerc > 0 && (
                                                <div className="flex justify-between items-center text-blue-600 dark:text-blue-400">
                                                    <span className="text-sm">Recetario Solidario (20%)</span>
                                                    <span className="font-bold">- {formatCurrency(res.recAmt)}</span>
                                                </div>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="bg-slate-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-slate-100 dark:border-slate-700">
                                                <span className="text-[12px] uppercase font-bold text-slate-400 block mb-1 tracking-wider">Total Caja</span>
                                                <div className="text-3xl font-black text-slate-900 dark:text-white">{formatCurrency(res.final)}</div>
                                            </div>
                                            {isMonthly && current.canSplit && (
                                                <div className="bg-blue-50 dark:bg-blue-900/20 p-5 rounded-2xl border border-blue-100 dark:border-blue-900/50">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-blue-600"><Icons.Split /></span>
                                                        <span className="text-[12px] uppercase font-bold text-blue-600 dark:text-blue-400 tracking-wider">Por mes</span>
                                                    </div>
                                                    <div className="text-3xl font-black text-blue-600 dark:text-blue-400">{formatCurrency(res.perMonth)}</div>
                                                    <p className="text-[11px] text-blue-500/70 mt-1 font-medium">Rinde 2 meses por lapicera</p>
                                                </div>
                                            )}
                                        </div>

                                        {savings > 0 && (
                                            <div className="mt-3 flex items-center justify-between gap-3 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-900/40 rounded-2xl p-4">
                                                <div>
                                                    <span className="text-[12px] uppercase font-bold text-emerald-600 dark:text-emerald-400 tracking-wider block mb-1">Tu ahorro vs PVP</span>
                                                    <div className="text-2xl font-black text-emerald-600 dark:text-emerald-400">{formatCurrency(savings)}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-3xl font-black text-emerald-600 dark:text-emerald-400">{savingsPct.toFixed(0)}%</div>
                                                    <span className="text-[12px] text-emerald-500/80 font-medium">menos que el PVP</span>
                                                </div>
                                            </div>
                                        )}

                                        <div className="mt-3 flex flex-wrap gap-3">
                                            <button onClick={shareResult} className="flex-1 min-w-[130px] flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold active:scale-[0.98] transition shadow-lg">
                                                <Icons.Share /> Compartir
                                            </button>
                                            <button onClick={copyResult} className="flex-1 min-w-[130px] flex items-center justify-center gap-2 py-3 px-4 rounded-2xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 font-bold text-slate-700 dark:text-slate-200 transition">
                                                {copied ? <React.Fragment><Icons.Check /> ¡Copiado!</React.Fragment> : <React.Fragment><Icons.Copy /> Copiar resumen</React.Fragment>}
                                            </button>
                                        </div>
                                    </React.Fragment>)}
                                </div>
                            </div>
                        </div>
                    )}

                    {showHistory && <HistoryModal />}

                    {tut && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                                <button onClick={closeTut} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-slate-600 transition"><Icons.Close /></button>
                                <div className="p-10">
                                    <div className="w-16 h-16 bg-blue-500 rounded-3xl flex items-center justify-center mb-6 text-white shadow-lg shadow-blue-500/30">
                                        <Icons.Logo />
                                    </div>
                                    <h2 className="text-3xl font-black mb-4 text-slate-900 dark:text-white">Bienvenido al Comparador GLP-1</h2>
                                    <p className="text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">
                                        Esta herramienta interactiva te permite comparar los costos de los medicamentos GLP-1 más comunes en Argentina, aplicando descuentos de laboratorios (PSP) y farmacias.
                                    </p>
                                    
                                    <div className="space-y-6">
                                        <div className="flex gap-4">
                                            <div className="text-blue-500 mt-1"><Icons.Split /></div>
                                            <div>
                                                <h4 className="font-bold text-sm text-slate-800 dark:text-slate-200">Conteo de Clics</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Activar "Mensualizar" para ver cuánto cuesta el mes de tratamiento, contando los clics y usando cada lapicera 2 meses(Mounjaro, Ozempic, Wegovy).</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="text-emerald-500 mt-1"><Icons.Sun /></div>
                                            <div>
                                                <h4 className="font-bold text-sm text-slate-800 dark:text-slate-200">Lógica de Descuento</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Primero configuramos el descuento de OOSS/Prepaga y el sistema calculará automáticamente el PSP sobre el saldo restante.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={closeTut} className="w-full mt-10 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-black py-4 rounded-2xl hover:scale-[1.02] transition shadow-xl">ENTENDIDO</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
